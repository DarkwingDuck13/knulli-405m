name: Build Knulli RG405M

on:
  workflow_dispatch:
  push:
    branches: [ main, knulli-main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 rsync bc bison flex texinfo unzip \
            libncurses5-dev libssl-dev cpio gettext libglib2.0-dev liblz4-tool u-boot-tools \
            mtools dosfstools squashfs-tools

      - name: Configure Target
        run: |
          make batocera-rg405m_defconfig

      - name: Compile Knulli Image
        run: |
          make -j$(nproc)

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rg405m-image
          path: output/images/*
